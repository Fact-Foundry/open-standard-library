name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: GitHub issues this job a short-lived identity token, which NuGet/login exchanges
    # for a temporary API key. No long-lived key is stored. The nuget.org policy must name this repo and workflow file.
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore OslSpreadsheet/OslSpreadsheet.csproj

      - name: Build
        run: dotnet build OslSpreadsheet/OslSpreadsheet.csproj --configuration Release --no-restore /p:Version=${{ env.VERSION }}

      - name: Pack
        run: dotnet pack OslSpreadsheet/OslSpreadsheet.csproj --configuration Release --no-build --output nupkg /p:PackageVersion=${{ env.VERSION }}

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push nupkg/*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
